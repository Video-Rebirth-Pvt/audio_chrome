# H3 audio VAE architecture, one key per field of chrome.codec.AudioVAEConfig.
# Matches FL2VA/audio_vae/metadata.json + config.yaml and the root audio_vae/config.json.
_base_: ../_base_/audio_spec.yaml

vae:
  sample_rate: ${audio.sample_rate}
  encoder_dim: 64
  encoder_rates: [2, 4, 4, 5, 5]          # product 800 = audio.hop_length
  latent_dim: 2048                        # encoder width before the attention bottleneck
  latent_channels: ${audio.latent_channels}
  attn_proj: true
  attn_heads: 8
  decoder_dim: 1024
  decoder_rates: [5, 5, 2, 2, 2, 2, 2]    # product 800, mirrors the encoder
  decoder_kernel_sizes: [9, 9, 4, 4, 4, 4, 4]
  resblock_kernel_sizes: [3, 7, 11]
  resblock_dilation_sizes: [[1, 3, 5], [1, 3, 5], [1, 3, 5]]
  snake_logscale: true
  use_tanh_at_final: false                # clamp to [-1, 1] instead
  use_bias_at_final: false
