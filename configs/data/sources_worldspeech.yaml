# WorldSpeech: audio from data/<locale>/<shard>.arrow (Opus bytes), text and QA from qa_sidecar. One source per
# locale, all with the filters of `worldspeech_source` (a YAML anchor; a key set in a source wins).
# Keys beyond sources_vrfoley.yaml:
#   include: glob on shard names in a directory path. "*train-*" also matches the AIR / bunge / znz shard names
#            (in_as_air-train-00000.parquet, tz_sw_bunge-train-00000.parquet) and keeps test shards out.
#   blobs:   <root>/<locale>/<shard>.arrow; row i of qa_sidecar/<locale>/<shard>.parquet is clip i of it,
#            checked by row count and segment_id. Written by scripts/data/migrate_audio.sh.
#   keep:    a list means "any of these values"; {max, allow_missing} is a range.
# Per-locale budget, on that source's line (no key: every kept row; changing a cap rebuilds only that source):
#   max_hours: 500      train clips up to 500 h (clip seconds, as inspect reports), a fixed hash-order prefix
#   max_records: 2e5    train rows; with both, the smaller cut wins
#   weight: 5e4         sampling weight in rows (default: the kept train rows); no rebuild
#   e.g. - {<<: *ws, name: ws_en_us, task: speech_en, max_hours: 500, paths: ["${paths.qa_sidecar_root}/en_us"]}
#
# Sidecar columns: row_index, segment_id, qa_risk_level (clean / medium / high), qa_risk_flags, cps_human,
# speech_active_ratio (empty for yue_hk), text_norm, resp, audio_path, and the HF shard's duration, cer, snr,
# dnsmos_*, human_transcript, asr_transcript, source*, session_date, language, country.
#
# Left out: cn_ug, kh_km, la_lo, mm_my, vn_vi are metadata-only upstream (audio_in_repo: false), every clip null.
# cs_cz and cz_cs share no segment_id but both cut psp_cz (Czech Chamber of Deputies) sessions.
#
# bash scripts/data/build_index.sh --config configs/data/t2a_worldspeech.yaml
# bash scripts/data/build_index.sh --config configs/data/t2a_worldspeech.yaml data.only=[ws_yue_hk,ws_en_us]
# bash scripts/data/inspect_data.sh --config configs/data/t2a_worldspeech.yaml
worldspeech_source: &ws
  # One val group: data.val.per_source clips for all of WorldSpeech, split evenly over languages (task).
  group: ws
  include: "*train-*.parquet"
  blobs: ${paths.worldspeech_root}
  columns: {audio: audio, caption: resp, duration: duration}
  keep:
    qa_risk_level: [clean, medium]
    # Thresholds in data.quality.ws_small (configs/data/t2a_base.yaml); a missing snr / dnsmos_ovr passes.
    cer:
      max: ${data.quality.ws_small.cer_max}
      allow_missing: false
    snr:
      min: ${data.quality.ws_small.snr_min}
      allow_missing: true
    dnsmos_ovr:
      min: ${data.quality.ws_small.dnsmos_ovr_min}
      allow_missing: true

# zh_tw, yue_hk, ja_jp, ko_kr: per-character cer, data.quality.ws_cjk. The merge is shallow: this keep
# replaces the whole keep of &ws.
worldspeech_cjk: &ws_cjk
  <<: *ws
  keep:
    qa_risk_level: [clean, medium]
    cer:
      max: ${data.quality.ws_cjk.cer_max}
      allow_missing: false
    snr:
      min: ${data.quality.ws_cjk.snr_min}
      allow_missing: true
    dnsmos_ovr:
      min: ${data.quality.ws_cjk.dnsmos_ovr_min}
      allow_missing: true

